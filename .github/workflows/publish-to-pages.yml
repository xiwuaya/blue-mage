name: Build and Deploy
on: [push]

# --- 新增：明确赋予 GITHUB_TOKEN 写入代码仓库的权限 ---
permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v3
        # --- 注意：这里去掉了 persist-credentials: false ---

      - name: Install and Build 🔧
        run: |
          yarn install
          yarn build

      # --- 将你刚才新增的 Commit 步骤放在 Build 之后，Deploy 之前 ---
      - name: Commit and Push changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          
          git add tools/spells.json
          git add tools/method_updates.csv
          git add src/App.vue
          
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: auto-update spells data and build date [skip ci]" && git push)

      - name: Deploy 🚀
        uses: JamesIves/github-pages-deploy-action@4.1.0
        with:
          branch: gh-pages
          folder: dist
          clean: true
