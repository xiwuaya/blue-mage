name: Build and Deploy
on: [push]

# --- 新增：明确赋予 GITHUB_TOKEN 写入代码仓库的权限 ---
permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    env:
      # playwright 是 hydration 回归测试（yarn verify:hydration）用的开发依赖，
      # CI 不跑它。不加这个，每次 push 的 yarn install 都会多下载约 150 MB 浏览器。
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v3
        # --- 注意：这里去掉了 persist-credentials: false ---

      - name: Install and Build 🔧
        run: |
          yarn install
          # GitHub Pages 把站点分发在子路径 blog.badend.cn/blue-mage/ 下，
          # 必须用 base=/blue-mage/ 构建，否则资源会去请求根域的 /assets/... 而 404。
          yarn build:subpath

      # --- 将你刚才新增的 Commit 步骤放在 Build 之后，Deploy 之前 ---
      - name: Commit and Push changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          
          git add tools/data/spells.json
          git add tools/data/method_updates.csv
          git add tools/data/map-keys.json
          # 新增技能时 update-descriptions.js 会增量抓取官方描述并落盘，
          # 提交缓存后后续构建不再请求 API
          git add tools/data/descriptions.json
          git add src/App.vue
          
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: auto-update spells data and build date [skip ci]" && git push)

      - name: Deploy 🚀
        # 必须 ≥ v4.9.0：v4.1.0 的 clean-exclude 实现为 rsync --exclude，而 --exclude
        # 对收发两侧同时生效 —— assets/ 既不会被删除，也不会被上传，2026-10-22 起
        # 新构建的图标/JS/CSS 全部没进 gh-pages（线上备用站点资源因此全 404）。
        # v4.9.0 改用 --filter "P assets/"，只保护旧文件不被清理，新文件正常上传。
        uses: JamesIves/github-pages-deploy-action@v4.9.0
        with:
          branch: gh-pages
          folder: dist
          clean: true
          # GitHub Pages 的 HTML 固定缓存 600s。部署后最多 10 分钟，持旧 HTML 的
          # 用户仍会请求上一版 hash 资源；保留 assets/ 避免这段窗口里 404。
          clean-exclude: assets/
